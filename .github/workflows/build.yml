name: Build Atomix APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Fixed Keystore & Print Keys
      run: |
        mkdir -p ~/.android
        if [ ! -f "app/debug.keystore" ]; then
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore app/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add app/debug.keystore
          git commit -m "Save fixed keystore" || true
          git push || true
        fi
        cp app/debug.keystore ~/.android/debug.keystore
        echo "=========================================="
        keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "(SHA1|SHA256):"
        echo "=========================================="

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Android APK
      run: gradle app:assembleDebug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: Atomix-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
